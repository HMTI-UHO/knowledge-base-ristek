name: Update Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog Content
        run: |
          echo "### Latest Updates ($(date +'%Y-%m-%d'))" > latest_changes.txt
          git log -10 --pretty=format:"- %s (%h)" >> latest_changes.txt
          
      - name: Write to Changelog.md
        run: |
          # Mengarahkan langsung ke path content/06-Changelog.md
          CHANGELOG_PATH="content/06-Changelog.md"
          
          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "Error: File tidak ditemukan di $CHANGELOG_PATH"
            exit 1
          fi
          
          # Membersihkan area di antara tag dan menyisipkan log baru
          sed -i '//,//{//!d}' "$CHANGELOG_PATH"
          sed -i '//r latest_changes.txt' "$CHANGELOG_PATH"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/06-Changelog.md
          # [skip ci] mencegah build berulang (infinite loop)
          git commit -m "docs: auto-update changelog [skip ci]" || echo "No changes to commit"
          git push