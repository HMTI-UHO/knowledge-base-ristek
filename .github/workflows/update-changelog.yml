name: Update Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate Changelog Content
        run: |
          echo "### Latest Updates ($(date +'%Y-%m-%d'))" > latest_changes.txt
          git log -10 --pretty=format:"- %s (%h)" >> latest_changes.txt
          
      - name: Write to Changelog.md
        run: |
          CHANGELOG_PATH="content/06-Changelog.md"
          
          # Membuat isi changelog baru dari git log
          echo -e "\n### Updated on $(date +'%Y-%m-%d %H:%M') WITA" > updates.txt
          git log -10 --pretty=format:"- %s (%h)" >> updates.txt
          echo -e "\n" >> updates.txt

          # Instruksi Robot: Hapus konten lama di antara tag, lalu masukkan updates.txt
          sed -i '/<updates>/,/<\/updates>/{/<updates>/!{/<\/updates>/!d;};};/<updates>/r updates.txt' "$CHANGELOG_PATH"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/06-Changelog.md
          # [skip ci] mencegah build berulang (infinite loop)
          git commit -m "docs: auto-update changelog [skip ci]" || echo "No changes to commit"
          git push