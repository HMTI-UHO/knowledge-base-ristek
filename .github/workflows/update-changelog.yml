name: Update Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write # Menegaskan izin menulis secara eksplisit

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog Content
        run: |
          echo "### Latest Updates ($(date +'%Y-%m-%d'))" > latest_changes.txt
          git log -10 --pretty=format:"- %s (%h)" >> latest_changes.txt
          
      - name: Write to Changelog.md
        run: |
          # Menyisipkan konten ke file 06-Changelog.md
          sed -i '//,//{//!d}' 06-Changelog.md
          sed -i '//r latest_changes.txt' 06-Changelog.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 06-Changelog.md
          # [skip ci] sangat penting agar tidak terjadi looping build
          git commit -m "docs: auto-update changelog [skip ci]" || echo "No changes to commit"
          git push